[project]
name = "invoice-agents"
version = "0.1.0"
description = "Multi-agent invoice processing prototype for Acme Corp (Galatiq case)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.10",
    "pydantic-ai-slim[anthropic,openai]>=2.68.0",
    "pydantic-graph>=2.68.0",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["data/generate_pdfs.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["invoice_agents", "main.py", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
